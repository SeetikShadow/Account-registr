<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact / Booking</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="contact-container">
        <h1>Contact</h1>
        <form action="#" method="POST">
            <div class="form-group">
                <label for="firstname">First name</label>
                <input type="text" id="firstname" name="firstname" required>
            </div>
            <div class="form-group">
                <label for="lastname">Last name</label>
                <input type="text" id="lastname" name="lastname" required>
            </div>
            <div class="form-group">
                <label for="email">Email address</label>
                <div class="email-wrapper">
                    <input type="text" id="email" name="email_user" placeholder="your_name" required>
                    <select name="email_domain" class="email-select">
                        <option value="@gmail.com">@gmail.com</option>
                        <option value="@ukr.net">@ukr.net</option>
                        <option value="@itstep.academy">@itstep.academy</option>
                        <option value="@itstep.org">@itstep.org</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label for="password">Password (6-10 chars, letters, numbers, - . / #)</label>
                <input type="password" id="password" name="password" 
                       minlength="6" maxlength="10" 
                       pattern="[A-Za-z0-9\-./#]+" 
                       title="От 6 до 10 символов. Разрешены буквы, цифры и знаки - . / #" 
                       required>
            </div>
            <div class="form-group">
                <label for="phone">Phone</label>
                <input type="tel" id="phone" name="phone">
            </div>
            <div class="form-group">
                <label>Date and time</label>
                <div class="datetime-grid">
                    <div>
                        <span class="sub-label">Day</span>
                        <input type="number" name="day" min="1" max="31">
                    </div>
                    <div>
                        <span class="sub-label">Month</span>
                        <select name="month">
                            <option value="" disabled selected></option>
                            <option value="1">January</option>
                            <option value="2">February</option>
                            <option value="3">March</option>
                            <option value="4">April</option>
                            <option value="5">May</option>
                            <option value="6">June</option>
                            <option value="7">July</option>
                            <option value="8">August</option>
                            <option value="9">September</option>
                            <option value="10">October</option>
                            <option value="11">November</option>
                            <option value="12">December</option>
                        </select>
                    </div>
                    <div>
                        <span class="sub-label">Year</span>
                        <input type="number" name="year">
                    </div>
                    <div>
                        <span class="sub-label">Time</span>
                        <input type="time" name="time">
                    </div>
                </div>
            </div>
            <div class="form-group">
                <label>Seating preference</label>
                <div class="radio-group">
                    <label class="radio-label">
                        <input type="radio" name="seating" value="indoor"> Indoor
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="seating" value="outdoor"> Outdoor
                    </label>
                </div>
            </div>
            <div class="form-group">
                <label for="requests">Additional requests</label>
                <input type="text" id="requests" name="requests">
            </div>
            <div class="checkbox-group">
                <input type="checkbox" id="newsletter" name="newsletter">
                <label for="newsletter">Yes, subscribe me to your newsletter.</label>
            </div>
            <button type="submit" class="submit-btn">Request booking</button>

        </form>
    </div>

</body>
</html>
